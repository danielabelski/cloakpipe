[package]
name = "cloakpipe-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server for CloakPipe — expose privacy tools to AI agents"

[dependencies]
cloakpipe-core = { path = "../cloakpipe-core", version = "0.11.0" }
cloakpipe-ledger = { path = "../cloakpipe-ledger", version = "0.11.0" }
cloakpipe-release = { path = "../cloakpipe-release", version = "0.11.0" }
cloakpipe-receipt = { path = "../cloakpipe-receipt", version = "0.11.0" }
# Legacy: only the `certification` feature verifies certification statements.
cloakpipe-cert = { path = "../cloakpipe-cert", version = "0.11.0", optional = true }
base64 = { version = "0.23", optional = true }
chrono = { workspace = true }
rmcp = { workspace = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v5"] }
sha2 = "0.10"
rusqlite = { workspace = true }
rand = { workspace = true }

[features]
# Legacy (source only, off by default): the gate also refuses every call
# unless the release holds a certification that verifies now for the gate's
# environment (`ToolGate::with_certification`). Removed in a later release.
certification = ["dep:cloakpipe-cert", "dep:base64"]

[dev-dependencies]
rusqlite = { workspace = true }
tempfile = "3"
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
chrono = { workspace = true }
cloakpipe-verify = { path = "../cloakpipe-verify" }
